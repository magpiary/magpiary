[project]
name = "magpiary"
version = "0.1.7"
description = "Turns shared Instagram reels and Threads posts into a searchable personal library on your own Mac."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "anthropic>=2.2.0",
    "coincurve>=21.0.0",
    "cryptography>=50.0.2",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
    "pywhispercpp>=1.5.1",
    "segno>=1.6.6",
    "tokenizers>=0.23.3",
    "websockets>=17.3",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
magpiary = "magpiary.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
