<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magpiary · B · Console</title>
<link rel="icon" href="example-cover.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0f11; --bg-2: #15171a; --bg-3: #1c1f23; --line: #26292e; --fg: #e6e7e9; --fg-2: #a0a4ab; --fg-3: #6b7078;
  --acc: #7c8cff; --acc-2: #2a2f55; --ok: #4fbf8a; --run: #e0b84f; --bad: #ef6b6b;
  --sans: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #fbfbfc; --bg-2: #f3f4f6; --bg-3: #e9ebee; --line: #e1e3e7; --fg: #16181b; --fg-2: #4a4f57; --fg-3: #8a9099;
    --acc: #4b5bdc; --acc-2: #e5e8ff; --ok: #1f8f5c; --run: #b0860f; --bad: #d03b3b; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
kbd { font: 500 10.5px var(--mono); color: var(--fg-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--bg-2); }
.app { display: grid; grid-template-columns: 208px minmax(340px, 1fr) minmax(380px, 1.15fr); grid-template-rows: 44px 1fr 28px; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.logo { font-weight: 600; letter-spacing: -.01em; width: 184px; display: flex; align-items: center; gap: 8px; }
.logo i { width: 16px; height: 16px; border-radius: 4px; background: linear-gradient(135deg, var(--acc), #b07cff); }
.cmd { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg-2); color: var(--fg-3); cursor: text; }
.cmd span { flex: 1; }
.hdr-r { margin-left: auto; display: flex; gap: 14px; align-items: center; color: var(--fg-2); }
.hdr-r a.on { color: var(--fg); }
.side { border-right: 1px solid var(--line); padding: 10px 8px; overflow: auto; }
.side h6 { margin: 14px 8px 4px; font: 500 10.5px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.side a { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 5px; color: var(--fg-2); }
.side a:hover { background: var(--bg-2); }
.side a.on { background: var(--bg-3); color: var(--fg); }
.side a .n { margin-left: auto; font: 11px var(--mono); color: var(--fg-3); }
.sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.list { border-right: 1px solid var(--line); overflow: auto; }
.lhead { position: sticky; top: 0; background: var(--bg); display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); z-index: 1; }
.lhead b { font-weight: 600; }
.lhead .meta { margin-left: auto; }
.meta { color: var(--fg-3); font-size: 12px; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.grp { padding: 10px 12px 4px; font: 500 11px var(--sans); color: var(--fg-3); }
.row { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 7px 12px; border-left: 2px solid transparent; cursor: pointer; }
.row:hover { background: var(--bg-2); }
.row.sel { background: var(--bg-3); border-left-color: var(--acc); }
.row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t.draft { color: var(--fg-3); font-style: italic; }
.row .sub { color: var(--fg-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r { text-align: right; color: var(--fg-3); font: 11px var(--mono); }
.pip { display: flex; gap: 2px; }
.pip i { width: 4px; height: 12px; border-radius: 1px; background: var(--line); }
.pip i.d { background: var(--ok); } .pip i.r { background: var(--run); animation: bl 1s infinite; } .pip i.x { background: var(--bad); }
@keyframes bl { 50% { opacity: .3; } }
.pane { overflow: auto; }
.det { padding: 18px 22px 60px; }
.det .crumbs { display: flex; gap: 8px; align-items: center; color: var(--fg-3); margin-bottom: 12px; }
.det .crumbs .actions { margin-left: auto; display: flex; gap: 6px; }
.b { height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-2); color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }
.b:hover { color: var(--fg); border-color: var(--fg-3); }
.det h1 { font-size: 19px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 8px; line-height: 1.3; }
.props { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.prop { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 5px; background: var(--bg-2); border: 1px solid var(--line); color: var(--fg-2); font-size: 12px; }
.media { display: grid; grid-template-columns: 150px 1fr; gap: 16px; margin-bottom: 18px; }
.vid { aspect-ratio: 9/16; border-radius: 8px; position: relative; overflow: hidden; }
.vid .tc { position: absolute; left: 8px; bottom: 8px; font: 11px var(--mono); color: #fff; background: rgba(0,0,0,.5); padding: 1px 6px; border-radius: 4px; }
.sum { font-size: 14px; line-height: 1.55; color: var(--fg); margin: 0 0 12px; }
.tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--line); margin: 6px 0 10px; }
.tabs button { padding: 8px 0; color: var(--fg-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--fg); border-color: var(--acc); }
.kp { display: grid; grid-template-columns: 46px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.kp button { font: 11.5px var(--mono); color: var(--acc); text-align: left; }
.ents { display: flex; flex-wrap: wrap; gap: 6px; }
.frames { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.frames div { aspect-ratio: 9/16; border-radius: 4px; position: relative; }
.frames span { position: absolute; left: 4px; bottom: 3px; font: 10px var(--mono); color: #fff; }
table.tm { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
table.tm td { padding: 6px 0; border-bottom: 1px solid var(--line); }
table.tm td:last-child { text-align: right; color: var(--fg-2); }
.tbar { height: 6px; border-radius: 3px; background: var(--acc); display: inline-block; vertical-align: middle; margin-right: 8px; }
.empty { padding: 40px 22px; color: var(--fg-3); }
.warnbox { border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 8%, transparent); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
footer { grid-column: 1 / -1; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 18px; padding: 0 12px; color: var(--fg-3); font-size: 11.5px; }
footer .live { display: flex; align-items: center; gap: 8px; color: var(--fg-2); }
footer .mini { width: 90px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
footer .mini i { display: block; height: 100%; width: 70%; background: var(--run); }
footer .keys { margin-left: auto; display: flex; gap: 12px; }
/* palette */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 10; }
.scrim.on { display: flex; }
.pal { width: min(640px, 92vw); background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.4); overflow: hidden; }
.pal input { width: 100%; height: 50px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--fg); font: 15px var(--sans); padding: 0 16px; outline: none; }
.pal .res { max-height: 52vh; overflow: auto; padding: 6px; }
.pal .gh { padding: 8px 10px 4px; font-size: 11px; color: var(--fg-3); }
.opt { padding: 8px 10px; border-radius: 7px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.opt.on, .opt:hover { background: var(--bg-3); }
.opt .hit { grid-column: 1 / -1; color: var(--fg-3); font-size: 12px; }
.opt .hit b { font: 500 10.5px var(--mono); color: var(--fg-3); margin-right: 6px; }
mark { background: color-mix(in srgb, var(--acc) 30%, transparent); color: var(--fg); border-radius: 2px; }
/* activity */
.act { grid-column: 2 / -1; overflow: auto; padding: 18px 22px; }
.lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.lane { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--bg-2); }
.lane h4 { margin: 0 0 8px; font-size: 12px; color: var(--fg-3); font-weight: 500; display: flex; justify-content: space-between; }
.stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 12px; }
.stepper div { font-size: 11px; color: var(--fg-3); }
.stepper div i { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-bottom: 5px; }
.stepper .d i { background: var(--ok); } .stepper .r i { background: var(--run); }
.log { font: 12px/1.7 var(--mono); color: var(--fg-2); background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.log .ts { color: var(--fg-3); margin-right: 10px; }
.log .ok { color: var(--ok); } .log .x { color: var(--bad); } .log .rn { color: var(--run); }
@media (max-width: 900px) {
  body { overflow: auto; } .app { grid-template-columns: 1fr; grid-template-rows: 44px auto auto auto 28px; height: auto; }
  .side { display: none; } .list { border-right: 0; max-height: 50vh; } .logo { width: auto; } .hdr-r { display: none; }
  .act { grid-column: 1; } .lanes { grid-template-columns: 1fr; } footer .keys { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><i></i>Magpiary</div>
    <div class="cmd" id="open-pal"><span>Search, paste a link, or run a command…</span><kbd>⌘K</kbd></div>
    <nav class="hdr-r"><a href="#/" id="h-lib">Library</a><a href="#/activity" id="h-act">Activity</a><a href="#/">Phones</a><a href="#/">Settings</a></nav>
  </header>
  <aside class="side" id="side"></aside>
  <section class="list" id="list"></section>
  <section class="pane" id="pane"></section>
  <footer>
    <span class="live"><span class="pip"><i class="r"></i></span>Summarising “Cedar Panels” <span class="mini"><i></i></span></span>
    <span>3 waiting</span><span>16 items · 164 MB</span>
    <span class="keys"><span><kbd>J</kbd><kbd>K</kbd> move</span><span><kbd>/</kbd> filter</span><span><kbd>E</kbd> done</span><span><kbd>T</kbd> tag</span><span><kbd>O</kbd> original</span></span>
  </footer>
</div>
<div class="scrim" id="scrim"><div class="pal"><input id="pq" placeholder="Search everything that was said, shown or written…"><div class="res" id="pres"></div></div></div>
<script src="data.js"></script>
<script>
const M = window.MAG, $ = s => document.querySelector(s), esc = s => M.mark(s || "", "");
const src = { instagram: "#e1306c", threads: "#888", youtube: "#ff3d3d", reddit: "#ff6a2b", x: "#aaa", linkedin: "#2d7ff9" };
let view = "inbox", sel = 15, tab = "summary";
const pipClass = (s, i) => s === "done" ? "d" : s === "summarising" ? (i < 3 ? "d" : "r") : s === "waiting" ? (i < 2 ? "d" : "") : (i === 0 ? "d" : i === 1 ? "x" : "");
const pips = it => `<span class="pip" title="saved · fetched · watched · summarised">${[0, 1, 2, 3].map(i => `<i class="${pipClass(it.status, i)}"></i>`).join("")}</span>`;
const visible = () => M.items.filter(i => view === "inbox" ? true : view === "attention" ? i.status === "attention" : view === "pending" ? ["waiting", "summarising"].includes(i.status) : view.startsWith("type:") ? i.type === view.slice(5) : view.startsWith("src:") ? i.source === view.slice(4) : true);

function side() {
  const c = f => M.items.filter(f).length;
  const types = [...new Set(M.items.filter(i => i.type).map(i => i.type))];
  const a = (v, label, n, sw = "") => `<a href="#/" data-view="${v}" class="${view === v ? "on" : ""}">${sw}${label}<span class="n">${n}</span></a>`;
  $("#side").innerHTML = a("inbox", "All items", M.items.length) + a("pending", "Being read", c(i => ["waiting", "summarising"].includes(i.status))) + a("attention", "Needs attention", c(i => i.status === "attention"), "")
    + `<h6>Type</h6>` + types.map(t => a("type:" + t, t, c(i => i.type === t))).join("")
    + `<h6>Source</h6>` + Object.entries(M.sources).map(([k, v]) => a("src:" + k, v, c(i => i.source === k), `<span class="sw" style="background:${src[k]}"></span>`)).join("")
    + `<h6>Shelves</h6>` + a("done", "Done", 0) + a("trash", "Trash", 0);
  document.querySelectorAll("[data-view]").forEach(x => x.onclick = e => { e.preventDefault(); view = x.dataset.view; render(); });
}
function list() {
  const items = visible(); let html = `<div class="lhead"><b>${$("[data-view].on")?.firstChild?.textContent || "All items"}</b><span class="meta">${items.length} · newest first</span></div>`, day = "";
  for (const it of items) {
    if (it.day !== day) { day = it.day; html += `<div class="grp">${day}</div>`; }
    html += `<div class="row ${it.id === sel ? "sel" : ""}" data-id="${it.id}"><span class="sw" style="background:${src[it.source]}"></span>
      <div style="min-width:0"><div class="t ${it.draft ? "draft" : ""}">${esc(it.title)}</div><div class="sub">${it.type ? it.type + " · " : ""}${it.author || "—"}</div></div>
      <div class="r">${pips(it)}<div style="margin-top:3px">${it.dur || (it.photos ? it.photos + "p" : it.kind === "text" ? "text" : "")}</div></div></div>`;
  }
  $("#list").innerHTML = html;
  document.querySelectorAll(".row").forEach(r => r.onclick = () => { location.hash = "#/item/" + r.dataset.id; });
}
function pane() {
  const it = M.byId[sel]; if (!it) { $("#pane").innerHTML = `<div class="empty">Select an item.</div>`; return; }
  const head = `<div class="crumbs"><span class="sw" style="background:${src[it.source]}"></span>${M.sources[it.source]} · ${it.saved}<span class="actions"><button class="b">Open original <kbd>O</kbd></button><button class="b">Done <kbd>E</kbd></button><button class="b">⋯</button></span></div>`;
  if (it.status === "attention") { $("#pane").innerHTML = `<div class="det">${head}<h1 class="mono">${esc(it.title)}</h1><div class="warnbox"><b>Couldn't fetch.</b> ${it.reason}.<div class="meta">${it.retry} · 3 tries so far</div></div><button class="b">Retry now</button> <button class="b">Use browser login…</button></div>`; return; }
  if (it.status !== "done") {
    $("#pane").innerHTML = `<div class="det">${head}<h1>${esc(it.title)}</h1><div class="props"><span class="prop">${it.status === "summarising" ? "● " + it.step : "Waiting · #2 in line"}</span></div>
    ${it.caption ? `<p class="sum" style="color:var(--fg-2)">${esc(it.caption)}</p><div class="meta">Title and text are from the caption until the summary is ready.</div>` : ""}
    <div class="stepper" style="max-width:360px;margin-top:16px"><div class="d"><i></i>Fetched</div><div class="${it.status === "summarising" ? "d" : ""}"><i></i>Transcript</div><div class="${it.status === "summarising" ? "d" : ""}"><i></i>Frames</div><div class="${it.status === "summarising" ? "r" : ""}"><i></i>Summary</div></div></div>`; return;
  }
  const body = tab === "summary" ? `<div>${it.points.map(([at, t]) => `<div class="kp">${at ? `<button data-at="${at}">${at}</button>` : "<span class='meta'>—</span>"}<span>${esc(t)}</span></div>`).join("")}</div>
      ${it.extras ? `<div style="margin-top:14px">${Object.entries(it.extras).map(([k, v]) => `<div class="kp"><span class="meta">${k}</span><span>${esc(v)}</span></div>`).join("")}</div>` : ""}
      ${it.things.length ? `<h6 class="meta" style="margin:16px 0 6px">MENTIONED</h6><div class="ents">${it.things.map(t => `<span class="prop">${t}</span>`).join("")}</div>` : ""}
      <h6 class="meta" style="margin:16px 0 6px">NOTE</h6><div class="prop" style="height:auto;padding:8px;width:100%;color:var(--fg-3)">Add a note… <kbd style="margin-left:auto">N</kbd></div>`
    : tab === "transcript" ? (it.transcript.length ? it.transcript.map(([at, t]) => `<div class="kp"><button>${at}</button><span>${esc(t)}</span></div>`).join("") : `<div class="meta">No speech (music only). Frames carry the content.</div>`)
    : tab === "frames" ? `<div class="frames">${[0,1,2,3,4,5,6,7].map(i => `<div style="background:linear-gradient(${i * 40}deg,hsl(${it.hue + i * 8} 45% 45%),hsl(${it.hue + 50} 40% 20%))"><span>0:${String(i * 11).padStart(2, "0")}</span></div>`).join("")}</div>`
    : `<table class="tm">${[["Fetch", 2.1], ["Transcript", 5.4], ["Frames", 3.3], ["Summary", 10.9]].map(([k, v]) => `<tr><td>${k}</td><td><span class="tbar" style="width:${v * 8}px"></span>${v} s</td></tr>`).join("")}<tr><td>Total</td><td>21.7 s</td></tr></table><p class="meta">gemini-3.6-flash · key “Personal Gemini” · Balanced preset</p>`;
  $("#pane").innerHTML = `<div class="det">${head}<h1>${esc(it.title)}</h1>
    <div class="props"><span class="prop">${it.type}</span><span class="prop">${it.author}</span>${it.tags.map(t => `<span class="prop">#${t}</span>`).join("")}<span class="prop" style="border-style:dashed">+ tag</span></div>
    <div class="media">${it.kind === "text" ? `<div class="vid" style="aspect-ratio:auto;background:var(--bg-2);border:1px solid var(--line);padding:10px;font-size:12px;color:var(--fg-2)">Text post · 212 comments saved</div>` : `<div class="vid" style="background:linear-gradient(160deg,hsl(${it.hue} 45% 50%),hsl(${it.hue + 40} 40% 18%))"><span class="tc" id="tc">0:00 / ${it.dur || it.photos + " photos"}</span></div>`}
    <div><p class="sum">${esc(it.summary)}</p>${it.discussion ? `<p class="meta"><b>Discussion:</b> ${esc(it.discussion)}</p>` : ""}<div class="meta mono">91 likes · 0 comments · as of today</div></div></div>
    <div class="tabs">${["summary", "transcript", "frames", "timing"].map(t => `<button data-tab="${t}" class="${tab === t ? "on" : ""}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</div>${body}</div>`;
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; pane(); });
  document.querySelectorAll("[data-at]").forEach(b => b.onclick = () => { $("#tc").textContent = b.dataset.at + " / " + it.dur; });
}
function activity() {
  const it = M.byId[17];
  $("#list").style.display = "none"; $("#pane").className = "act";
  $("#pane").innerHTML = `<div class="lanes">
    <div class="lane"><h4>Fetch lane <span>idle</span></h4><div class="meta">Nothing to fetch. Next yt-dlp update check in 9 h.</div></div>
    <div class="lane"><h4>Process lane <span class="mono">${it.pct}%</span></h4><div>${esc(it.title)}</div><div class="meta">${M.sources[it.source]} · ${it.author}</div>
      <div class="stepper"><div class="d"><i></i>Transcript 5.4 s</div><div class="d"><i></i>Frames 3.3 s</div><div class="r"><i></i>Summary…</div><div><i></i>Note</div></div></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px">
      <div class="lane"><h4>Queue <span>${M.queue.length}</span></h4>${M.queue.map((i, n) => `<div class="kp"><span class="meta mono">#${n + 1}</span><span>${esc(M.byId[i].title)}</span></div>`).join("")}</div>
      <div class="lane"><h4>Median per step <span>last 4</span></h4><table class="tm"><tr><td>Transcript</td><td>5.1 s</td></tr><tr><td>Frames</td><td>3.0 s</td></tr><tr><td>Summary</td><td>11.4 s</td></tr></table></div></div>
    <div class="log">
      <div><span class="ts">23:14:13</span><span class="ok">done</span>  instagram/De0L00rsloZ  summary 10.9 s · gemini-3.6-flash</div>
      <div><span class="ts">23:14:02</span>frames  instagram/De0L00rsloZ  8 frames · 3.3 s</div>
      <div><span class="ts">23:13:58</span>transcript  instagram/De0L00rsloZ  1:27 audio · 5.4 s</div>
      <div><span class="ts">23:11:40</span><span class="rn">retry</span>  gemini-3.7-flash 503 busy → re-picked gemini-3.6-flash</div>
      <div><span class="ts">23:02:11</span>received  2 items from “Example iPhone”</div>
      <div><span class="ts">22:58:30</span><span class="x">attention</span>  instagram/DcX2…  login wall · retry in 3 h</div></div>`;
}
function palette(open) {
  $("#scrim").classList.toggle("on", open); if (!open) return;
  const q = $("#pq"); q.value = ""; q.focus(); renderPal();
}
function renderPal() {
  const v = $("#pq").value;
  if (/^https?:\/\//.test(v)) { $("#pres").innerHTML = `<div class="gh">Link</div><div class="opt on"><span>Add to library: <span class="mono">${esc(v.split("?")[0])}</span></span><kbd>↵</kbd><div class="hit">Tracking removed: ${v.includes("?") ? "<span class='mono'>?" + esc(v.split("?")[1]) + "</span>" : "nothing to remove"}</div></div>`; return; }
  const r = M.search(v);
  const cmds = [["Go to Activity", "#/activity"], ["Show items needing attention", "#/"], ["Pause summaries", "#/"], ["Settings: AI keys", "#/"]].filter(c => !v || c[0].toLowerCase().includes(v.toLowerCase()));
  $("#pres").innerHTML = (r.length ? `<div class="gh">Items · ${r.length}</div>` + r.slice(0, 6).map(({ it, hits }, i) => `<div class="opt ${i === 0 ? "on" : ""}" data-go="#/item/${it.id}"><span>${M.mark(it.title, v)}</span><span class="meta">${it.type}</span>${hits.filter(h => h.where !== "Title").slice(0, 1).map(h => `<div class="hit"><b>${h.where.toUpperCase()}${h.at ? " " + h.at : ""}</b>${M.mark(h.text.slice(0, 120), v)}</div>`).join("")}</div>`).join("") : v ? `<div class="gh">No items match “${esc(v)}”</div>` : `<div class="gh">Type to search transcripts, summaries and captions. Paste a link to add it.</div>`)
    + (cmds.length ? `<div class="gh">Commands</div>` + cmds.map(c => `<div class="opt" data-go="${c[1]}"><span>${c[0]}</span></div>`).join("") : "");
  document.querySelectorAll(".opt[data-go]").forEach(o => o.onclick = () => { palette(false); location.hash = o.dataset.go; });
}
$("#pq").oninput = renderPal;
$("#pq").onkeydown = e => { if (e.key === "Enter") { const o = $(".opt.on[data-go]") || $(".opt[data-go]"); if (o) o.click(); else palette(false); } if (e.key === "Escape") palette(false); };
$("#open-pal").onclick = () => palette(true);
$("#scrim").onclick = e => { if (e.target.id === "scrim") palette(false); };
document.addEventListener("keydown", e => {
  if ($("#scrim").classList.contains("on")) return;
  if ((e.metaKey || e.ctrlKey) && e.key === "k" || e.key === "/") { e.preventDefault(); palette(true); return; }
  if (e.key === "j" || e.key === "k") { const ids = visible().map(i => i.id); const n = ids.indexOf(sel) + (e.key === "j" ? 1 : -1); if (ids[n]) location.hash = "#/item/" + ids[n]; }
});
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g && !g.classList.contains("opt")) location.hash = g.dataset.go; });
function render() { side(); list(); pane(); }
function route() {
  const p = (location.hash || "#/").slice(1);
  $("#h-act").classList.toggle("on", p.startsWith("/activity")); $("#h-lib").classList.toggle("on", !p.startsWith("/activity"));
  $("#list").style.display = ""; $("#pane").className = "pane";
  if (p.startsWith("/item/")) { sel = +p.split("/")[2]; tab = "summary"; }
  if (p.startsWith("/search")) { render(); palette(true); return; }
  side(); if (p.startsWith("/activity")) { activity(); return; }
  list(); pane(); document.querySelector(".row.sel")?.scrollIntoView({ block: "nearest" });
}
addEventListener("hashchange", route); route();
</script>
</body>
</html>
