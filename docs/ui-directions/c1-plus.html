<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magpiary · C1+</title>
<link rel="icon" href="example-cover.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="c-common.css">
<style>
:root { --box: 100vw; --pad: max(clamp(16px, 3vw, 36px), calc((100vw - var(--box)) / 2)); }
:root { --bg: #ffffff; --fg: #111; --fg-2: #555; --fg-3: #9a9a9a; --line: #ececec; --chip: #f4f4f2; --card: #fff; --ok: #1ec27a;
  --tile: 220px; --gap: 18px; --tfs: 17px; --sh: 0 30px 80px -20px rgba(0,0,0,.35); }
:root[data-size="s"] { --tile: 150px; --gap: 12px; --tfs: 14px; }
:root[data-size="l"] { --tile: 320px; --gap: 24px; --tfs: 22px; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f0f0f; --fg: #f5f3ee; --fg-2: #b9b6ae; --fg-3: #77746d; --line: #262626; --chip: #1c1c1c; --card: #161616; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "DM Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body.lock { overflow: hidden; }
/* top */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; padding: 12px var(--pad); }
.logo { font: 800 25px/1 var(--display); letter-spacing: -.03em; white-space: nowrap; }
.logo i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--t-design); margin-left: 2px; }
.search { flex: 1; max-width: 440px; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 999px; background: var(--chip); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: var(--fg); outline: none; }
.bar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.sizes { background: var(--chip); }
.sizes button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.btn { height: 40px; padding: 0 18px; border-radius: 999px; background: var(--chip); font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
.btn[aria-disabled="true"] { background: var(--chip) !important; color: var(--fg-3) !important; pointer-events: none; }
.btn.dark { background: var(--fg); color: var(--bg); }
.btn.sm { height: 32px; padding: 0 14px; font-size: 13.5px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--chip); }
.seg button, .seg a { height: 34px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); }
.seg .on { background: var(--fg); color: var(--bg); }
.gear { width: 40px; height: 40px; border-radius: 50%; background: var(--chip); font-size: 18px; display: grid; place-items: center; }
.gear.on { background: var(--fg); color: var(--bg); }
/* strip */
/* the strip: background activity, one quiet shade of dark in both themes */
:root { --strip: #2a2926; --strip-fg: rgba(255,255,255,.72); --strip-chip: rgba(255,255,255,.07); }
@media (prefers-color-scheme: dark) { :root { --strip: #1a1a19; --strip-fg: rgba(255,255,255,.62); --strip-chip: rgba(255,255,255,.06); } }
.ticker { display: flex; align-items: center; gap: 12px; padding: 6px var(--pad); background: var(--strip); color: var(--strip-fg); font-size: 12.5px; cursor: pointer; border-top: 1px solid rgba(255,255,255,.04); }
.ticker:hover { color: #fff; }
.ticker b { font: 700 11.5px var(--display); opacity: .8; letter-spacing: .02em; text-transform: uppercase; flex: none; display: flex; align-items: center; gap: 8px; }
.ticker b i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: p 1.5s infinite; }
@keyframes p { 50% { opacity: .3; } }
.tks { display: flex; gap: 10px; overflow: hidden; flex: 1; min-width: 0; }
.tk { flex: none; display: flex; align-items: center; gap: 7px; padding: 2px 10px 2px 2px; border-radius: 999px; background: var(--strip-chip); }
.tk .th { width: 20px; height: 20px; border-radius: 50%; }
.tk .pb { width: 40px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
.tk .pb i { display: block; height: 100%; background: var(--t-design); }
.ticker .more { flex: none; font-weight: 600; }
.ticker .warn { flex: none; color: #f0a08f; font-weight: 600; }
.drop { overflow: hidden; max-height: 0; transition: max-height .35s cubic-bezier(.2, .8, .2, 1); background: var(--fg); color: var(--bg); }
.drop.on { max-height: 460px; }
.drop .in { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 14px; padding: 4px var(--pad) 18px; }
.dcard { background: color-mix(in srgb, var(--bg) 10%, transparent); border-radius: 18px; padding: 14px; }
.dcard h5 { margin: 0 0 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .6; }
.dnow { display: grid; grid-template-columns: 64px 1fr; gap: 12px; }
.dnow .p { aspect-ratio: 1; border-radius: 12px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 10px; font-size: 11px; opacity: .85; }
.steps i { display: block; height: 4px; border-radius: 2px; background: color-mix(in srgb, currentColor 22%, transparent); margin-bottom: 4px; }
.steps .d i { background: var(--ok); } .steps .r i { background: var(--t-design); animation: p 1s infinite; }
.dl { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
.dl .th { width: 28px; height: 28px; border-radius: 8px; flex: none; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tg { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: color-mix(in srgb, currentColor 10%, transparent); font-size: 13px; cursor: pointer; }
.tg i { width: 28px; height: 16px; border-radius: 999px; background: var(--ok); position: relative; }
.tg i::after { content: ""; position: absolute; top: 2px; right: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: right .2s; }
.tg.off i { background: color-mix(in srgb, currentColor 30%, transparent); } .tg.off i::after { right: 14px; }
/* wall */
.wrap { padding: 26px var(--pad) 120px; }
.hero { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 22px; }
.hero h1 { font: 800 clamp(40px, 6vw, 72px)/.95 var(--display); letter-spacing: -.045em; margin: 0; }
.hero h1 em { font-style: normal; color: var(--t-design); }
.hero p { margin: 0; color: var(--fg-2); max-width: 560px; font-size: 15.5px; }
.hero .meta1 { max-width: none; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hero .meta1 b { color: var(--fg); }
.ctrl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.f { flex: none; height: 34px; padding: 0 13px; border-radius: 999px; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 7px; background: var(--chip); }
.f i { width: 9px; height: 9px; border-radius: 3px; }
.f .n { color: var(--fg-3); font-weight: 500; }
.f.on { background: var(--fg); color: var(--bg); }
.sec { display: flex; align-items: baseline; gap: 12px; margin: 34px 0 14px; }
.sec h2 { font: 800 30px/1 var(--display); letter-spacing: -.035em; margin: 0; }
.sec span { color: var(--fg-3); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr)); gap: var(--gap); }
.tile { cursor: pointer; border-radius: 20px; overflow: hidden; background: var(--chip); display: flex; flex-direction: column; transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s; position: relative; }
.tile:hover { transform: translateY(-4px) rotate(-.6deg); box-shadow: 0 18px 36px -12px rgba(0,0,0,.28); }
.tile:nth-child(even):hover { transform: translateY(-4px) rotate(.6deg); }
.tile.sel { outline: 3px solid var(--fg); outline-offset: 3px; }
.sq { aspect-ratio: 1; position: relative; }
.sq .src { position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 600; color: #fff; background: rgba(0,0,0,.4); backdrop-filter: blur(6px); padding: 3px 9px; border-radius: 999px; }
.sq .dur { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 600; color: #fff; background: rgba(0,0,0,.4); padding: 3px 8px; border-radius: 999px; }
.sq .typo { position: absolute; inset: 0; display: grid; place-items: center; padding: 18px; text-align: center; color: #fff; font: 800 calc(var(--tfs) * 1.25)/1.05 var(--display); letter-spacing: -.02em; }
.sq .quote { position: absolute; inset: auto 8px 8px 8px; background: rgba(255,255,255,.94); color: #111; border-radius: 12px; padding: 8px 10px; font-size: 12.5px; line-height: 1.35; }
.sq .quote small { display: block; font-weight: 700; font-size: 10.5px; color: #777; text-transform: uppercase; letter-spacing: .05em; }
.sq .prog { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.35); overflow: hidden; }
.sq .prog i { display: block; height: 100%; background: #fff; transition: width .6s; }
.sq .prog.ind i { width: 35% !important; animation: ind 1.2s infinite linear; }
@keyframes ind { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.label { padding: 12px 14px 14px; color: #fff; flex: 1; }
.label .t { font: 700 var(--tfs)/1.15 var(--display); letter-spacing: -.015em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.label .m { font-size: 12px; opacity: .8; margin-top: 4px; }
.label .s { font-size: 13px; opacity: .9; margin-top: 8px; display: none; }
:root[data-size="l"] .label .s { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
:root[data-size="s"] .label .m, :root[data-size="s"] .sq .dur { display: none; }
.label .m.nk { display: flex !important; align-items: center; gap: 8px; }
.sumb { margin-left: auto; flex: none; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.22); color: #fff; opacity: 1; }
.tile:hover .sumb { background: #fff; color: #111; }
.ctl { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.cbox { display: grid; grid-template-columns: auto 1fr; gap: 14px; background: var(--chip); border-radius: 20px; padding: 16px; cursor: pointer; align-items: start; }
.cbox .tg { padding: 0; background: none; margin-top: 3px; }
.cbox b { font: 700 16px var(--display); }
.cbox p { margin: 2px 0 0; color: var(--fg-2); font-size: 13px; }
.tile.pend .sq { filter: grayscale(.85); }
.tile.pend .label { background: var(--chip) !important; color: var(--fg-2); }
.tile.attn { border: 2.5px dashed var(--t-news); background: transparent; }
.tile.attn .sq { display: grid; place-items: center; text-align: center; padding: 16px; color: var(--fg-2); font-size: 14px; }
.tile.attn .sq b { display: block; color: var(--fg); font: 700 17px var(--display); }
.tile.ghost { border: 2.5px dashed var(--line); background: transparent; cursor: default; }
.tile.ghost:hover { transform: none; box-shadow: none; }
.tile.ghost .sq { display: grid; place-items: center; color: var(--fg-3); font-size: 13px; text-align: center; padding: 14px; }
.tile.new { animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
/* piles */
.piles { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--tile) + 50px), 1fr)); gap: 30px var(--gap); }
.pile { cursor: pointer; }
.stack { position: relative; aspect-ratio: 1.25; margin-bottom: 12px; }
.stack div { position: absolute; width: 62%; aspect-ratio: 1; border-radius: 18px; border: 4px solid var(--bg); box-shadow: 0 8px 24px -8px rgba(0,0,0,.3); transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
.stack div:nth-child(1) { left: 2%; top: 12%; transform: rotate(-8deg); }
.stack div:nth-child(2) { left: 36%; top: 10%; transform: rotate(7deg); }
.stack div:nth-child(3) { left: 19%; top: 0; z-index: 2; }
.pile:hover .stack div:nth-child(1) { transform: rotate(-13deg) translate(-12px, 4px); }
.pile:hover .stack div:nth-child(2) { transform: rotate(12deg) translate(12px, 4px); }
.pile:hover .stack div:nth-child(3) { transform: translateY(-8px); }
.pile .lab { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 16px; color: #fff; }
.pile .lab b { font: 700 calc(var(--tfs) + 1px)/1.15 var(--display); letter-spacing: -.015em; flex: 1; }
.pile .lab span { font-size: 12.5px; opacity: .85; white-space: nowrap; }
.pile .lab em { font-style: normal; font-size: 11px; font-weight: 700; background: #fff; color: #111; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pile p { margin: 6px 4px 0; color: var(--fg-2); font-size: 13px; }
.back { color: var(--fg-3); font-weight: 600; font-size: 14px; }
/* banners and first run */
.banner { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 20px; background: color-mix(in srgb, var(--t-howto) 10%, var(--bg)); border: 1.5px solid color-mix(in srgb, var(--t-howto) 30%, transparent); margin-bottom: 24px; flex-wrap: wrap; }
.banner b { font: 700 18px var(--display); display: block; }
.banner p { margin: 0; color: var(--fg-2); font-size: 14px; flex: 1; min-width: 240px; }
.steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 6px 0 36px; }
.step { border-radius: 22px; padding: 20px; color: #fff; position: relative; min-height: 210px; display: flex; flex-direction: column; }
.step .n { font: 800 44px/1 var(--display); opacity: .5; }
.step b { font: 700 21px/1.15 var(--display); margin: 10px 0 6px; display: block; }
.step p { margin: 0 0 14px; opacity: .9; font-size: 14px; flex: 1; }
.step .btn { background: #fff; color: #111; align-self: flex-start; height: 36px; }
.step.done { opacity: .55; } .step.done .n::after { content: " ✓"; }
/* item: shared */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10,10,10,.35); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.it-type { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-3); font-weight: 500; }
.it-type b { font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px; color: #fff; }
.it-h { font: 800 34px/1.02 var(--display); letter-spacing: -.035em; margin: 12px 0 8px; }
.it-by { color: var(--fg-3); font-size: 13.5px; margin-bottom: 16px; }
.it-act { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.it-sum { font-size: 17px; line-height: 1.6; margin: 0 0 6px; }
.it h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--fg-3); margin: 28px 0 10px; }
.kp { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: start; padding: 11px 12px; border-radius: 14px; cursor: pointer; line-height: 1.45; font-size: 15.5px; }
.kp:hover, .kp.on { background: var(--chip); }
.kp b { width: 26px; height: 26px; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: 12px; display: grid; place-items: center; }
.kp.on b { background: var(--t-design); color: #fff; }
.kp small { color: var(--fg-3); font-weight: 600; font-size: 12.5px; padding-top: 2px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips span { padding: 5px 12px; border-radius: 999px; background: var(--chip); font-size: 13.5px; }
.chips .dash { background: none; border: 1.5px dashed var(--line); color: var(--fg-3); cursor: pointer; }
.note { width: 100%; min-height: 70px; border: 1.5px solid var(--line); border-radius: 14px; background: transparent; color: var(--fg); font: inherit; padding: 10px 12px; resize: vertical; }
details.more { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; }
details.more summary { cursor: pointer; font-weight: 600; color: var(--fg-2); }
.tbar { display: grid; grid-template-columns: 90px 1fr 50px; gap: 10px; align-items: center; font-size: 13px; margin: 6px 0; color: var(--fg-2); }
.tbar i { height: 8px; border-radius: 4px; display: block; }
/* mini player */
.pl { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 9/16; background: #000; }
.pl.wide { aspect-ratio: 16/9; }
.pl .pp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,.5); backdrop-filter: blur(6px); color: #fff; display: grid; place-items: center; }
.pl .tc { position: absolute; left: 8px; bottom: 8px; right: 8px; color: #fff; font-size: 11.5px; font-weight: 600; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 8px; transition: background .2s; }
.pl .tc.hl { background: var(--t-design); }
.fr { display: grid; gap: 4px; position: relative; }
.fr div { aspect-ratio: 9/16; border-radius: 6px; position: relative; transition: outline .15s; }
.fr div.on { outline: 2.5px solid var(--t-design); outline-offset: 1px; }
.fr div span { position: absolute; top: -7px; right: -5px; width: 18px; height: 18px; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.rb { width: 38px; height: 38px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 16px; flex: none; }
/* card: the video gets 40% of a near-full-screen card, information the other 60% */
.cardm { position: fixed; z-index: 41; inset: 0; margin: auto; width: min(1480px, calc(100vw - 32px)); height: calc(100vh - 32px); opacity: 0; transform: scale(.98) translateY(10px); pointer-events: none; transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .2s; background: var(--card); border-radius: 28px; box-shadow: var(--sh); display: grid; grid-template-columns: 40% minmax(0, 1fr); overflow: hidden; }
.cardm.on { opacity: 1; transform: none; pointer-events: auto; }
.cardm .vid { background: #0c0c0c; display: flex; flex-direction: column; gap: 10px; padding: 18px; min-height: 0; min-width: 0; }
.cardm .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.cardm .stage .pl { height: 100%; max-width: 100%; border-radius: 18px; }
.cardm .stage .pl.wide { width: 100%; height: auto; max-height: 100%; }
.cardm .pp { width: 72px; height: 72px; font-size: 24px; }
.cardm .tc { font-size: 13px; padding: 7px 12px; left: 12px; right: 12px; bottom: 12px; }
.cardm .vid .fr { grid-template-columns: none !important; grid-auto-flow: column; grid-auto-columns: 50px; overflow-x: auto; padding: 9px 4px 2px; scrollbar-width: none; }
.cardm .vid .cap { color: #8a8a8a; font-size: 12px; display: flex; justify-content: space-between; }
.cardm .main { overflow: auto; padding: 22px 44px 60px; }
.cardm .navrow { display: flex; gap: 6px; justify-content: flex-end; margin-right: -22px; }
.cardm .main .it-act { margin-bottom: 18px; }
.meta2 { font-size: 12.5px; color: var(--fg-3); display: grid; gap: 3px; }
/* pending/problem inside item */
.pstate { border-radius: 20px; padding: 18px; background: var(--chip); margin-bottom: 18px; }
.pstate .steps { color: var(--fg); }
.pstate.bad { background: color-mix(in srgb, var(--t-news) 9%, var(--bg)); border: 1.5px dashed var(--t-news); }
.pstate b { font: 700 18px var(--display); display: block; margin-bottom: 4px; }
.pstate p { margin: 0 0 12px; color: var(--fg-2); font-size: 14px; }
/* nest */
.nest .now { display: grid; grid-template-columns: 180px 1fr; gap: 24px; background: var(--fg); color: var(--bg); border-radius: 28px; padding: 20px; margin-bottom: 18px; }
.nest .now .p { aspect-ratio: 1; border-radius: 18px; }
.nest .now h3 { font: 800 28px/1.05 var(--display); letter-spacing: -.03em; margin: 6px 0 4px; }
.nest .now .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .6; }
.nest .now .steps { font-size: 12.5px; max-width: 520px; }
.cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.panel { background: var(--chip); border-radius: 24px; padding: 18px; }
.panel h3 { font: 800 20px var(--display); letter-spacing: -.02em; margin: 0 0 12px; display: flex; justify-content: space-between; }
.panel h3 span { color: var(--fg-3); font-weight: 500; font-size: 14px; }
.row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 8px; border-radius: 14px; cursor: pointer; font-size: 14px; line-height: 1.3; }
.row:hover { background: var(--bg); }
.row .th { aspect-ratio: 1; border-radius: 10px; }
.row small { color: var(--fg-3); display: block; }
.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
.hist th { text-align: left; font-size: 11.5px; color: var(--fg-3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 8px; }
.hist td { padding: 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.hist .t { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; }

  { id: 5, name: "Materials & Studio tools", sub: "Pebble Desk, Swatch Tray", ids: [2], fresh: 1, type: "Tool" },
  { id: 6, name: "Paper experiments", sub: "Folds, strips, spirals", ids: [9], fresh: 0, type: "Explainer" },
  { id: 7, name: "Recipe & Skillet", sub: "Carrots, lentils, lemon", ids: [10], fresh: 0, type: "Recipe" },

const pileById = id => PILES.find(p => p.id === +id);

function relatedTo(id) {

    <div class="prev" id="pprev"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn" data-pclose>Cancel</button><button class="btn dark" id="padd" disabled style="opacity:.4">Add to Today</button></div>
    <p style="font-size:12.5px;color:var(--fg-3);margin:10px 0 0">Try: <button style="text-decoration:underline" data-try="https://www.instagram.com/reel/Example0004/?igsh=example-tracking&utm_source=ig_web_copy_link">an Instagram reel</button> · <button style="text-decoration:underline" data-try="https://youtu.be/Example0005?si=example-tracking">a YouTube short link</button> · <button style="text-decoration:underline" data-try="https://example.com/article?utm_source=x">another website</button> · <button style="text-decoration:underline" data-try="hello world">not a link</button></p>`;
  $("#modal").classList.add("on"); $("#scrim").classList.add("on");

  const check = () => {
    const v = inp.value.trim(), p = $("#pprev"), add = $("#padd");
    if (!v) { p.className = "prev"; add.disabled = true; add.style.opacity = .4; return; }
    let u; try { u = new URL(v); } catch (e) { p.className = "prev on err"; p.innerHTML = "<b>That isn't a link.</b> Paste the full address, starting with https://"; add.disabled = true; add.style.opacity = .4; return; }
    const yt = /youtu/.test(u.host), src = /instagram/.test(u.host) ? "Instagram" : yt ? "YouTube" : /threads/.test(u.host) ? "Threads" : /reddit/.test(u.host) ? "Reddit" : /x\.com|twitter/.test(u.host) ? "X" : /linkedin/.test(u.host) ? "LinkedIn" : "";
    if (!src) { p.className = "prev on"; p.innerHTML = `<b>${esc(u.host)} · another website</b><br><code>${esc(u.origin + u.pathname)}</code><div class="rm" style="color:var(--fg-3)">Saved with its page details (title, text, picture). Tracking removed: everything after “?”.</div>`; add.disabled = false; add.style.opacity = 1; add.dataset.src = "other"; return; }

    const clean = yt && u.host === "youtu.be" ? `https://www.youtube.com/watch?v=${u.pathname.slice(1)}` : u.origin + u.pathname;
    p.className = "prev on"; p.innerHTML = `<b>${src}${yt && u.host === "youtu.be" ? " · short link expanded" : ""}</b><br><code>${esc(clean)}</code>${removed.length ? `<div class="rm">Removed: ${removed.map(k => `<s>${esc(k)}</s>`).join("")}</div>` : `<div class="rm" style="color:var(--fg-3)">Nothing to remove.</div>`}`;
    add.disabled = false; add.style.opacity = 1; add.dataset.src = src.toLowerCase();
  };
  inp.oninput = check;
  $("#modal").querySelectorAll("[data-try]").forEach(b => b.onclick = () => { inp.value = b.dataset.try; check(); });
  $("#modal").querySelector("[data-pclose]").onclick = closePaste;
  $("#padd").onclick = () => {
    const src = $("#padd").dataset.src === "other" ? "instagram" : $("#padd").dataset.src; const id = 100 + extra.length;
    const it = { id, source: src, kind: "video", author: "", dur: "", saved: "Just now", day: "Today", title: src === "youtube" ? "YouTube video" : "Instagram reel", type: "", status: "fetching", hue: 200, keep: true, isNew: true,
      summary: "", points: [], things: [], tags: [], transcript: [], links: [], saves: 1, folder: "library/new", bgOverride: `url(example-cover.svg) center/cover` };
    extra.unshift(it); closePaste();
    if (opt.state === "first") { opt.state = "normal"; syncMock(); ticker(); }
    wallMode = "everything"; filter = ""; location.hash = "#/"; wall(); toast("Added to Today · fetching now");
    setTimeout(() => { it.status = "summarising"; it.step = "Listening"; it.pct = 25; it.isNew = false; it.title = "Make a folded paper lantern"; it.author = "Example Paper Lab"; it.dur = "0:44"; if (location.hash === "#/" || location.hash === "") wall(); }, 2600);
    setTimeout(() => { it.pct = 80; it.step = "Writing the summary"; if (location.hash === "#/" || location.hash === "") wall(); }, 4800);
    setTimeout(() => { Object.assign(it, { status: "done", type: "Explainer", summary: "Uses a hotel with infinitely many rooms to show why infinity plus one is still infinity.", points: [["0:05", "Hilbert's hotel"], ["0:22", "Moving every guest one room up"]] }); if (location.hash === "#/" || location.hash === "") wall(); toast("Read: “How do you explain infinity to a kid?”"); }, 7000);
  };
}
