<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="958" viewBox="0 0 1200 958" font-family="-apple-system,Helvetica,Arial,sans-serif"><rect width="1200" height="958" fill="#FBF6EA"/><text x="40" y="52" font-size="30" font-weight="700" fill="#111111">Magpiary wordmark options</text><text x="40" y="80" font-size="15" fill="#5a5547">Same symbol, same sparkle. Only the letter style changes.</text><rect x="40" y="100" width="1120" height="190" rx="18" fill="#fff" stroke="#e6dfd0"/><image href="data:image/svg+xml;base64," x="70" y="123.7" width="640" height="142.7"/><text x="760" y="170" font-size="26" font-weight="700" fill="#111111">A  Rounded</text><text x="760" y="202" font-size="15" fill="#5a5547">Soft round ends, medium weight. Closest to Google Sans.</text><rect x="40" y="312" width="1120" height="190" rx="18" fill="#fff" stroke="#e6dfd0"/><image href="data:image/svg+xml;base64," x="70" y="335.6" width="640" height="142.8"/><text x="760" y="382" font-size="26" font-weight="700" fill="#111111">B  Crisp</text><text x="760" y="414" font-size="15" fill="#5a5547">Flat ends, clean and confident. Current look + capital M.</text><rect x="40" y="524" width="1120" height="190" rx="18" fill="#fff" stroke="#e6dfd0"/><image href="data:image/svg+xml;base64," x="70" y="547.4" width="640" height="143.2"/><text x="760" y="594" font-size="26" font-weight="700" fill="#111111">C  Light</text><text x="760" y="626" font-size="15" fill="#5a5547">Thin and airy, more elegant and editorial</text><rect x="40" y="736" width="1120" height="190" rx="18" fill="#fff" stroke="#e6dfd0"/><image href="data:image/svg+xml;base64," x="70" y="760.0" width="640" height="142.0"/><text x="760" y="806" font-size="26" font-weight="700" fill="#111111">D  Bold</text><text x="760" y="838" font-size="15" fill="#5a5547">Heavy and tightly spaced, strong at small sizes</text></svg>